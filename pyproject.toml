[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyedit"
version = "0.2.0"
description = "Comfortable, version-checked code editing for agents"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.optional-dependencies]
agent = ["mcp>=1.12,<2", "rope>=1.13,<2"]
python = ["rope>=1.13,<2"]

[project.scripts]
comfyedit = "comfyedit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
